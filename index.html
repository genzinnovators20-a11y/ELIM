    <style>
      /* First-paint shell — removed by the app once React mounts. */
      html { background: #05070a; }
      body { margin: 0; background: #05070a; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05070a;
        z-index: 9999;
        transition: opacity 520ms ease, visibility 520ms ease;
      }
      #boot[data-hidden='true'] { opacity: 0; visibility: hidden; }
      #boot .ring {
        width: 56px;
        height: 56px;
        border-radius: 999px;
        border: 1px solid rgba(212, 175, 55, 0.18);
        border-top-color: rgba(212, 175, 55, 0.85);
        animation: boot-spin 900ms linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring { animation-duration: 2400ms; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><div class="ring"></div></div>
