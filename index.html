    <!--
      The masthead emblem is the Largest Contentful Paint element, and it is now
      genuinely the first thing painted: Home is part of the entry bundle and the
      <img> is in its first render, so this preload is consumed the moment React
      commits rather than sitting in the cache for a second waiting for a probe.

      The build injects the font and chunk preloads immediately below this line — see
      `injectCriticalPreloads` in vite.config.js.
    -->
    <link rel="preload" as="image" href="/brand/elimcoin-blue.webp" type="image/webp" fetchpriority="high" />

    <style>
      /*
       * First paint, before a byte of the application has run.
       *
       * This used to also carry a full-screen overlay with a spinning ring,
       * which React removed once it had committed. The intent was reassurance;
       * the effect was the opposite. The overlay *was* the First Contentful
       * Paint, so the metric reported the spinner rather than the page, and it
       * held a lid over the masthead until React had finished — then spent a
       * further 520ms fading out over content that was already there. A visitor
       * on a throttled phone watched a spinner for two seconds and then a fade.
       *
       * With Home in the entry bundle and the emblem in its first render there
       * is nothing left to wait for, so the shell is now just the ground: the
       * obsidian the design sits on, painted from the HTML. The next thing the
       * reader sees is the masthead itself.
       */
      html {
        background: #05070a;
        /* The dark ground must apply before any stylesheet lands, or the
           browser paints its own white default first and the entrance reads as
           a flash. */
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #05070a;
      }
    </style>
