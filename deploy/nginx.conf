# ─────────────────────────────────────────────────────────────────────────────
#  ELIM FORGE — Nginx site configuration (Contabo VPS)
#
#  Install:
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/elimforge
#    sudo ln -s /etc/nginx/sites-available/elimforge /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  TLS (Let's Encrypt) — run after the HTTP block below is live:
#    sudo certbot --nginx -d elimforge.com -d www.elimforge.com
#  Certbot rewrites this file to add the 443 server block and the HTTP redirect.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name elimforge.com www.elimforge.com;

    root /var/www/elimforge/current;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                  always;
    add_header X-Frame-Options           "SAMEORIGIN"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # Uncomment once TLS is in place:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/woff font/woff2;

    # Serve pre-compressed Brotli if ngx_brotli is available.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Hashed build assets: immutable, cache for a year ────────────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Brand artwork and static files: cache, but revalidate weekly ────────
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Crawler files: always fresh ─────────────────────────────────────────
    location = /robots.txt   { expires -1; try_files $uri =404; }
    location = /sitemap.xml  { expires -1; try_files $uri =404; }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Required: /elimcoin, /ecosystem, /news, /login and /signup are client-side
    # routes with no file on disk. Without this, a refresh or a direct link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or users get stale asset hashes
    # after a deploy.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 404 /index.html;
}
